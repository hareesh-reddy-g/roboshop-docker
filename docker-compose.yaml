services:
  catalogue:
    build:
      context: ./catalogue
      dockerfile: Dockerfile
    image: hareeshreddygundlapalli/catalogue:v1
    container_name: catalogue
    depends_on:
    - mongodb
  mongodb:
    build:
    context: ./mongodb
    image: hareeshreddygundlapalli/mongodb:v1
    container_name: mongodb
    volumes:
    - mongodb:/data/db
  redis:
    image: redis:7.0
    container_name: redis
    volumes:
    - redis:/data
  mysql:
    image: hareeshreddygundlapalli/mysql:v1
    container_name: mysql
    volumes:
    - mysql:/var/lib/mysql
  rabbitmq:
    image: rabbitmq:3
    container_name: rabbitmq
    volumes:
    - rabbitmq:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: roboshop
      RABBITMQ_DEFAULT_PASS: roboshop123 
  user:
    image: hareeshreddygundlapalli/user:v1
    container_name: user
    depends_on:
    - mongodb
    - redis
  cart:
    image: hareeshreddygundlapalli/cart:v1
    container_name: cart
    depends_on:
    - redis
    - catalogue
  shipping:
    image: hareeshreddygundlapalli/shipping:v1
    container_name: shipping
    depends_on:
    - mysql
    - cart
  payment:
    image: hareeshreddygundlapalli/payment:v1
    container_name: payment
    depends_on:
    - rabbitmq
    - cart
    - user
  frontend:
    image: hareeshreddygundlapalli/frontend:v1
    container_name: frontend
    ports:
    - "80:80"
    depends_on:
    - catalogue
    - user
    - cart
    - shipping
    - payment
networks:
  default:
    driver: bridge
    name: roboshop
    external: false # true if we have created network manually through command or console using docker network command
volumes:
  mongodb: # docker volume create mongodb. /var/lib/docker/volumes
  redis:
  mysql:
  rabbitmq: